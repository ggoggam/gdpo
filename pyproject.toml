[project]
name = "gdpo"
version = "0.1.0"
description = "Code for `GDPO: Learning to Directly Align Language Models with Diversity Using GFlowNets`"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.2.1",
    "backoff>=2.2.1",
    "datasets>=3.2.0",
    "deepspeed>=0.16.2",
    "isort>=5.13.2",
    "openai>=1.59.6",
    "optree>=0.13.1",
    "polars>=1.19.0",
    "ruff>=0.9.1",
    "sentence-transformers>=3.3.1",
    "tyro>=0.9.8",
    "vllm>=0.6.6.post1",
    "wandb>=0.25.0",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build]
sources = ["src", "config"]

[tool.hatch.build.targets.wheel]
exclude = ["mise.toml"]

[tool.hatch.build.targets.sdist]
exclude = ["mise.toml"]

[tool.ruff]
include = ["pyproject.toml", "src/**/*.py"]
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Docstring rules - too noisy for a research codebase
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",
    "D200", "D203", "D205", "D210", "D211", "D212", "D213",
    "D400", "D401", "D415", "D417",
    # Type annotation rules - too verbose
    "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN401",
    # Boolean trap rules
    "FBT001", "FBT002", "FBT003",
    # Exception message style
    "TRY003", "EM101", "EM102",
    # Too many arguments - unavoidable in trainer APIs
    "PLR0913",
    # Unused method args - needed for protocol/mixin compatibility
    "ARG002",
    # N812: lowercase imported as non-lowercase (F = functional is idiomatic)
    "N812",
    # S101: assert is fine outside tests for internal invariants
    "S101",
    # S311: random is fine for non-cryptographic use
    "S311",
    # C901/PLR0912: complexity - acceptable for training loops
    "C901", "PLR0912",
]
